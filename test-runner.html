<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invoice Generator Test Runner</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f5f5f5;
        }
        .test-container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            border-radius: 8px;
        }
        h1 {
            color: #333;
            text-align: center;
        }
        .controls {
            text-align: center;
            margin: 20px 0;
        }
        button {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover {
            background-color: #45a049;
        }
        #testResults {
            margin-top: 20px;
            padding: 20px;
            background-color: #f9f9f9;
            border-radius: 4px;
            font-family: monospace;
            white-space: pre-wrap;
            max-height: 400px;
            overflow-y: auto;
        }
        #invoiceFrame {
            width: 100%;
            height: 600px;
            border: 1px solid #ddd;
            margin-top: 20px;
        }
        .status {
            padding: 10px;
            margin: 10px 0;
            border-radius: 4px;
        }
        .status.success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .status.error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .status.info {
            background-color: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
    </style>
</head>
<body>
    <div class="test-container">
        <h1>Vibe Invoice Generator - Test Runner</h1>
        
        <div class="controls">
            <button onclick="runTests()">Run All Tests</button>
            <button onclick="loadInvoice()">Load Invoice Page</button>
            <button onclick="clearResults()">Clear Results</button>
            <button onclick="runManualTest()">Run Manual Test Case</button>
        </div>

        <div id="status" class="status info">
            Click "Load Invoice Page" to start, then "Run All Tests" to execute the test suite.
        </div>

        <div id="testResults"></div>

        <iframe id="invoiceFrame" src="Vibe Invoice.html"></iframe>
    </div>

    <script>
        let testResults = [];
        let invoiceWindow = null;

        function loadInvoice() {
            const iframe = document.getElementById('invoiceFrame');
            iframe.src = 'Vibe Invoice.html';
            invoiceWindow = iframe.contentWindow;
            
            iframe.onload = function() {
                updateStatus('Invoice page loaded successfully!', 'success');
                // Inject the test script
                const script = invoiceWindow.document.createElement('script');
                script.src = 'test-suite.js';
                invoiceWindow.document.head.appendChild(script);
            };
        }

        function updateStatus(message, type = 'info') {
            const status = document.getElementById('status');
            status.textContent = message;
            status.className = 'status ' + type;
        }

        function clearResults() {
            document.getElementById('testResults').textContent = '';
            testResults = [];
            updateStatus('Results cleared', 'info');
        }

        function runTests() {
            if (!invoiceWindow || !invoiceWindow.tester) {
                updateStatus('Please load the invoice page first!', 'error');
                return;
            }

            updateStatus('Running tests...', 'info');
            clearResults();

            // Override console methods to capture output
            const resultsDiv = document.getElementById('testResults');
            const originalLog = invoiceWindow.console.log;
            const originalError = invoiceWindow.console.error;

            invoiceWindow.console.log = function(...args) {
                const message = args.join(' ');
                resultsDiv.textContent += message + '\n';
                resultsDiv.scrollTop = resultsDiv.scrollHeight;
                originalLog.apply(invoiceWindow.console, args);
            };

            invoiceWindow.console.error = function(...args) {
                const message = args.join(' ');
                resultsDiv.textContent += message + '\n';
                resultsDiv.scrollTop = resultsDiv.scrollHeight;
                originalError.apply(invoiceWindow.console, args);
            };

            // Run the tests
            invoiceWindow.tester.runAllTests();

            // Restore console methods after tests complete
            setTimeout(() => {
                invoiceWindow.console.log = originalLog;
                invoiceWindow.console.error = originalError;
                updateStatus('Tests completed! Check results below.', 'success');
            }, 10000);
        }

        function runManualTest() {
            if (!invoiceWindow) {
                updateStatus('Please load the invoice page first!', 'error');
                return;
            }

            updateStatus('Running manual test case...', 'info');
            
            // Manual test case for specific scenarios
            const doc = invoiceWindow.document;
            
            // Test 1: Check for any remaining 2px borders
            const elements = doc.querySelectorAll('[style*="2px"]');
            if (elements.length > 0) {
                console.error('Found elements with 2px borders:', elements.length);
                elements.forEach(el => {
                    console.log('Element with 2px:', el.tagName, el.getAttribute('style'));
                });
            }

            // Test 2: Check state code divider
            const stateDiv = doc.querySelector('[style*="border-right: 1px solid #000"]');
            if (stateDiv) {
                console.log('✅ State code divider has 1px border');
            } else {
                console.error('❌ State code divider not found or has wrong border');
            }

            // Test 3: Test automatic GST type selection based on state codes
            const sellerStateCode = doc.querySelector('#sellerStateCode');
            const customerStateCode = doc.querySelector('#customerStateCode');
            
            if (sellerStateCode && customerStateCode) {
                // Set same state codes
                sellerStateCode.value = '27';
                customerStateCode.value = '27';
                sellerStateCode.dispatchEvent(new Event('change'));
                customerStateCode.dispatchEvent(new Event('change'));
                
                // Check if it should suggest CGST & SGST
                setTimeout(() => {
                    console.log('Test: Same state codes (27, 27) - Should use CGST & SGST');
                    
                    // Set different state codes
                    customerStateCode.value = '29';
                    customerStateCode.dispatchEvent(new Event('change'));
                    
                    setTimeout(() => {
                        console.log('Test: Different state codes (27, 29) - Should use IGST');
                        updateStatus('Manual tests completed!', 'success');
                    }, 500);
                }, 500);
            }
        }

        // Load invoice page automatically on page load
        window.onload = function() {
            loadInvoice();
        };
    </script>
</body>
</html>
