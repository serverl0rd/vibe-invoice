<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4CAF50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2E7D32;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Document background -->
  <rect x="4" y="2" width="24" height="28" rx="2" fill="white" stroke="#E0E0E0" stroke-width="1"/>
  
  <!-- Header section -->
  <rect x="6" y="4" width="20" height="3" fill="grad"/>
  
  <!-- Invoice lines -->
  <rect x="7" y="10" width="10" height="1" fill="#BDBDBD"/>
  <rect x="7" y="12" width="18" height="1" fill="#BDBDBD"/>
  <rect x="7" y="14" width="14" height="1" fill="#BDBDBD"/>
  
  <!-- Amount section -->
  <rect x="7" y="18" width="8" height="1" fill="#757575"/>
  <rect x="18" y="18" width="7" height="1" fill="#4CAF50"/>
  <rect x="7" y="20" width="6" height="1" fill="#757575"/>
  <rect x="18" y="20" width="7" height="1" fill="#4CAF50"/>
  
  <!-- Total line -->
  <rect x="7" y="23" width="18" height="2" fill="grad"/>
  
  <!-- Currency symbol -->
  <text x="9" y="28" font-family="Arial, sans-serif" font-size="6" fill="#4CAF50" font-weight="bold">₹</text>
</svg>